<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas.emscripten {
    position: absolute;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    object-position: center;
    border: 0;
    outline: 0;
    background: #000;

    /* Bloom */
    filter: url(#bloom);
}

/* Error console */
#error-console {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 120px;
    box-sizing: border-box;

    display: none;

    background: rgba(0, 0, 0, 0.9);
    color: #ff5555;
    border: 0;
    outline: 0;
    resize: none;

    font: 12px monospace;
    padding: 8px;
    z-index: 9999;
}
</style>
</head>

<body>

<!--
    SVG filter used for bloom.

    Pipeline:

        Source
          |
          +----------------------------+
          |                            |
          v                            |
      Bright-pass                      |
          |                            |
          v                            |
      Gaussian blur                    |
          |                            |
          +-------------> <!--ADD ---------+
                              |
                              v
                           Output
-->
<svg
    width="0"
    height="0"
    style="position:absolute"
    aria-hidden="true"
>
    <defs>

        <filter
            id="bloom"
            x="-40%"
            y="-40%"
            width="180%"
            height="180%"
            color-interpolation-filters="sRGB"
        >

            <!--
                Extract bright pixels.

                Values below the threshold become black.
                Values above it remain visible.

                Increase the slope / adjust intercept to
                make bloom affect only very bright pixels.
            -->
            <feComponentTransfer
                in="SourceGraphic"
                result="bright"
            >
                <feFuncR
                    type="linear"
                    slope="4"
                    intercept="-3"
                />
                <feFuncG
                    type="linear"
                    slope="4"
                    intercept="-3"
                />
                <feFuncB
                    type="linear"
                    slope="4"
                    intercept="-3"
                />
            </feComponentTransfer>

            <!-- Large soft glow -->
            <feGaussianBlur
                in="bright"
                stdDeviation="18"
                result="blur1"
            />

            <!-- Medium glow -->
            <feGaussianBlur
                in="bright"
                stdDeviation="7"
                result="blur2"
            />

            <!-- Additive bloom -->
            <feMerge>
                <feMergeNode in="blur1" />
                <feMergeNode in="blur2" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>

        </filter>
    </defs>
</svg>

<canvas
    class="emscripten"
    id="canvas"
    oncontextmenu="event.preventDefault()"
    tabindex="-1"
></canvas>

<textarea id="error-console" readonly></textarea>

<script>
var canvasElement = document.getElementById('canvas');
var outputElement = document.getElementById('error-console');

/*
 * Keep the console hidden unless an actual error is reported.
 */
function showError(text) {
    outputElement.style.display = 'block';
    outputElement.value += text + '\n';
    outputElement.scrollTop = outputElement.scrollHeight;
}

/*
 * WebGL context loss handling.
 */
canvasElement.addEventListener(
    'webglcontextlost',
    function (e) {
        showError('WebGL context lost. Reload the page.');
        e.preventDefault();
    },
    false
);

/*
 * Emscripten status callback.
 *
 * We don't have a loading/status UI anymore.
 */
var setStatus = function(text) {
    console.log(text);
};

/*
 * Emscripten Module.
 */
var Module = {

    canvas: canvasElement,

    setStatus: setStatus,

    print: function(...args) {
        console.log(...args);
    },

    printErr: function(...args) {
        console.error(...args);
        showError(args.join(' '));
    },

    totalDependencies: 0,

    monitorRunDependencies: function(left) {
        this.totalDependencies =
            Math.max(this.totalDependencies, left);

        if (left === 0) {
            console.log('Emscripten initialization complete.');
        }
    }
};

/*
 * Forward uncaught JavaScript errors to the error console.
 */
window.onerror = function(message, source, lineno, colno, error) {
    console.error(message, source, lineno, colno, error);

    showError(
        '[JS ERROR] ' +
        message +
        ' (' +
        source +
        ':' +
        lineno +
        ':' +
        colno +
        ')'
    );
};

window.onunhandledrejection = function(event) {
    console.error(event.reason);
    showError(
        '[UNHANDLED PROMISE] ' +
        (event.reason || 'Unknown error')
    );
};
</script>

<script async src="index.js"></script>

</body>
</html>
